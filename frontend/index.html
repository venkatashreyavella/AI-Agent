<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>Northstar — AI assistant</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">✳</div><span>northstar</span></div>
      <button class="new-chat" id="new-chat"><span>＋</span> New conversation <kbd>⌘ K</kbd></button>
      <div class="side-label">RECENT</div>
      <nav id="conversation-list" class="conversation-list" aria-label="Conversation history"></nav>
      <div class="sidebar-bottom">
        <button class="side-action" id="settings-open"><span>⚙</span> Settings</button>
        <div class="profile"><div class="avatar">Y</div><div><strong>Your workspace</strong><small>Personal</small></div><span class="dots">···</span></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar"><button class="mobile-menu" id="mobile-menu" aria-label="Open menu">☰</button><div class="model-label"><span class="status-dot"></span><span id="model-name">Assistant</span><span class="chevron">⌄</span></div><div class="top-actions"><button class="icon-button" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">◐</button><a class="icon-button" href="/api/health" target="_blank" aria-label="Service status" title="Service status">⌁</a></div></header>
      <section class="chat-area" id="chat-area">
        <div class="welcome" id="welcome">
          <div class="welcome-orb">✳</div>
          <p class="eyebrow">YOUR THINKING PARTNER</p>
          <h1>What’s on your mind?</h1>
          <p class="welcome-copy">Ask anything. Explore an idea, solve a problem, or make something happen.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Explain quantum computing from the basics, with a simple analogy."><span class="suggestion-icon purple">◈</span><span><strong>Learn something</strong><small>Explain quantum computing simply</small></span><span class="suggestion-arrow">↗</span></button>
            <button class="suggestion" data-prompt="Help me break a complex problem into a clear, manageable plan."><span class="suggestion-icon orange">⌘</span><span><strong>Work through a problem</strong><small>Turn a big challenge into steps</small></span><span class="suggestion-arrow">↗</span></button>
            <button class="suggestion" data-prompt="Give me a few creative ideas for a small project I can finish this weekend."><span class="suggestion-icon green">✧</span><span><strong>Explore an idea</strong><small>Find inspiration for your next project</small></span><span class="suggestion-arrow">↗</span></button>
            <button class="suggestion" data-prompt="Help me write a clear, friendly email about a project update."><span class="suggestion-icon blue">✎</span><span><strong>Write something</strong><small>Draft a thoughtful project update</small></span><span class="suggestion-arrow">↗</span></button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>
      <div class="composer-wrap"><form class="composer" id="composer"><textarea id="prompt" rows="1" placeholder="Message Northstar…" aria-label="Message"></textarea><div class="composer-tools"><div class="composer-hints"><button type="button" class="tool-button" title="Attach a file (coming soon)" disabled>＋</button><span>Tools <span class="coming-soon">coming soon</span></span></div><button class="send-button" id="send-button" type="submit" aria-label="Send message"><span>↑</span></button></div></form><p class="disclaimer">Northstar can make mistakes. Verify important information.</p></div>
    </main>
  </div>
  <dialog id="settings-dialog"><form method="dialog"><div class="dialog-head"><div><p class="eyebrow">PREFERENCES</p><h2>Settings</h2></div><button class="icon-button" aria-label="Close">×</button></div><label class="setting-row"><span><strong>Model</strong><small>Set LLM_MODEL in your server .env file.</small></span><span class="setting-value" id="settings-model">—</span></label><label class="setting-row"><span><strong>Conversation memory</strong><small>Chats are saved only in this browser.</small></span><span class="setting-value">Local</span></label><button type="button" class="clear-button" id="clear-history">Clear all conversations</button></form></dialog>
  <script src="/static/app.js" defer></script>
</body>
</html>
